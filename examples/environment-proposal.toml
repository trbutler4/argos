# PROPOSED schema only. There is no loader yet and these entries are not enrolled.
# Copy/edit per client when future remote VM placement is implemented. SSH aliases
# must already work. No credentials, private keys or executable bootstrap snippets
# belong here.
#
# This is machine inventory + project defaults, not the runtime VM registry.
# A per-repo .argos.toml is the active repo profile format for packages and guest
# ports. Argos installs packages and forwards ports, but it does not manage app
# processes.
schema_version = 1

[client]
# Client-local value; change when using the tool from a different machine.
machine_id = "workstation"
connect_timeout_seconds = 3
max_parallel_probes = 4

[machines.workstation]
ssh_alias = "workstation"
# Capability intent, not proof that KVM/permissions/VM setup are installed.
allow_managed_vms = true

[machines.server]
ssh_alias = "server"
allow_managed_vms = false

[defaults.vm]
vcpus = 4
memory_mib = 4096
# Initial sizing hypothesis. Measure real stack and disk use during M1.
disk_gib = 32
# Future remote placement may use this as a default allocation range.
host_port_range = [43000, 45999]

[projects.example]
# Placeholder only. First real project and its authentication are not chosen yet.
repository = "https://example.invalid/me/project.git"
base_ref = "main"
profile = ".argos.toml"

# Active per-repo profile example, stored in the repo itself:
#
# [workspace]
# workdir = "/workspace/repo"
#
# [vm]
# packages = ["go", "nodejs", "postgresql", "redis", "just"]
#
# [[ports]]
# name = "api"
# guest = 3001
#
# [[ports]]
# name = "web"
# guest = 5173
