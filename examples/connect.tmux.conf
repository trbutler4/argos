# Return-to-picker binding for Argos (tui, sessions attach, connect, vm tmux).
# Connection ownership is automatic; key installation is opt-in on each tmux
# server after reviewing your existing F12 binding. Requires GNU grep and /proc.
# The marker belongs to the invoking client process, never the shared session.
# Unsupported/missing markers leave unmanaged clients attached with guidance.
bind-key -n F12 if-shell 'grep -zqx ARGOS_CONNECT_CLIENT=1 /proc/#{client_pid}/environ 2>/dev/null' "detach-client -E 'exit 78'" 'display-message "Start Argos in your original terminal to use the global picker"'
