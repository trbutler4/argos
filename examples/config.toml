# Active machine inventory. Copy to ~/.config/argos/config.toml and customize.
# All names below are fictional. No credentials or private endpoints belong in Git.
schema_version = 1

[client]
machine_id = "workstation"
# Per-host total discovery deadline, including connection and command execution.
connect_timeout_seconds = 3
max_parallel_probes = 4

[machines.workstation]
# The client machine is always queried locally, without SSH.
# socket = "/absolute/path/to/tmux.sock"

[machines.server]
# Existing SSH alias/hostname. Host key must already be trusted and auth noninteractive.
ssh_alias = "server"
# Optional remote Unix socket. Omit to use the remote tmux default.
# socket = "/absolute/path/to/tmux.sock"

# Optional guest tmux configuration for locally managed VMs. Set exactly one of
# config_path or config_text. Relative paths resolve from this config file.
# [vm.guest_tmux]
# config_path = "/absolute/path/to/tmux.conf"
# config_text = """
# set -g mouse on
# """
