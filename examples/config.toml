# PROPOSED schema only. There is no loader yet and these entries are not enrolled.
# Copy/edit per client when M0 is implemented. SSH aliases must already work.
# No credentials, private keys or executable bootstrap snippets belong here.
# This is machine inventory + project defaults, not the runtime VM registry.
# env create chooses a host and allocates guest identity, disk and clone paths.
# Service entries below describe access targets, not process definitions.
# Databases/processes and their persistent state are defined by the project's devenv.
schema_version = 1

[client]
# Client-local value; change when using the tool from a different machine.
machine_id = "workstation"
connect_timeout_seconds = 3
max_parallel_probes = 4

[machines.workstation]
ssh_alias = "workstation"
# Capability intent, not proof that KVM/permissions/VM setup are installed.
allow_managed_vms = true

[machines.server]
ssh_alias = "server"
allow_managed_vms = false

[defaults.vm]
vcpus = 2
memory_mib = 4096
# Initial sizing hypothesis. Measure real stack and disk use during M1.
disk_gib = 32

[projects.example]
# Placeholder only. First real project and its authentication are not chosen yet.
repository = "https://example.invalid/me/project.git"
base_ref = "main"
tooling = "devenv"
autostart_stack = false

[projects.example.services.web]
# Target inside guest, reached through SSH forwarding. Not host/tailnet ingress.
host = "127.0.0.1"
port = 3000
scheme = "http"

[projects.example.services.api]
host = "127.0.0.1"
port = 8080
scheme = "http"
