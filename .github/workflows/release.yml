name: Validate and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate and build standalone binary
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release metadata
        id: version
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/release.py check --base-ref "$BASE_REF"

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Validate CLI and integration behavior
        run: |
          nix develop --command bash -c '
            actionlint &&
            cargo fmt --check &&
            cargo test --locked &&
            cargo clippy --locked --all-targets -- -D warnings &&
            cargo build --locked &&
            python3 tests/release.py &&
            python3 tests/host_status.py &&
            python3 tests/vm_list.py &&
            python3 tests/vm_resources.py &&
            python3 tests/vm_host_ports.py &&
            python3 tests/vm_modules.py &&
            python3 tests/vm_fetch.py &&
            python3 tests/credential_sharing.py &&
            python3 tests/jcode.py &&
            python3 tests/local_tmux.py &&
            python3 tests/config_cli.py &&
            python3 tests/remote_ssh.py &&
            python3 tests/attach_tmux.py &&
            python3 tests/remote_attach.py &&
            python3 tests/connect.py &&
            python3 tests/tui.py &&
            python3 tests/completions.py
          '

      - name: Build and verify release archive
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          nix build .#argos-release --out-link result-release
          nix develop --command python3 scripts/package_release.py --package result-release
          nix develop --command python3 tests/release_artifact.py "dist/argos-${TAG}-x86_64-linux.tar.gz" --integration
          python3 scripts/release.py notes > dist/release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  darwin:
    name: Validate native Darwin package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Validate portable process and artifact handling
        run: |
          nix develop --command bash -c '
            cargo fmt --check &&
            cargo test --locked &&
            cargo clippy --locked --all-targets -- -D warnings
          '

      - name: Build unpatched Darwin package
        run: nix build .#packages.aarch64-darwin.default

  publish:
    name: Publish Cargo version
    needs: [validate, darwin]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.sha }}
          path: dist

      - name: Publish immutable release or resume its draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          archive="argos-${TAG}-x86_64-linux.tar.gz"
          (cd dist && sha256sum --check "${archive}.sha256")

          draft=""
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"; then
            if [ "$draft" = false ]; then
              git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
              echo "${TAG} is already published. Validation passed; no assets or tags were changed."
              exit 0
            fi
          fi

          if git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            if [ "$(git cat-file -t "refs/tags/${TAG}")" != tag ]; then
              echo "${TAG} must be an annotated release tag; it will not be replaced." >&2
              exit 1
            fi
            if [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "${TAG} belongs to another commit. Rerun its original workflow to recover the release." >&2
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Argos ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

          if [ "$draft" != true ]; then
            gh release create "$TAG" --verify-tag --draft \
              --title "Argos ${TAG}" --notes-file dist/release-notes.md
          fi
          # A failed upload leaves a draft. Retrying the same commit is safe;
          # published releases are never overwritten by this workflow.
          gh release upload "$TAG" "dist/${archive}" "dist/${archive}.sha256" --clobber
          gh release edit "$TAG" --draft=false --latest --notes-file dist/release-notes.md
