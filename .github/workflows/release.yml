name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Cargo version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(${PYTHON:-python3} - <<'PY'
          import tomllib
          with open('Cargo.toml', 'rb') as f:
              print(tomllib.load(f)['package']['version'])
          PY
          )"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${tag} already exists. Skipping release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate
        if: steps.version.outputs.skip != 'true'
        run: |
          nix develop --command bash -lc '
            cargo fmt -- --check &&
            cargo clippy --locked -- -D warnings &&
            cargo test --locked -- --nocapture
          '

      - name: Build release binary
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          nix build .#packages.x86_64-linux.default
          mkdir -p dist
          cp result/bin/argos "dist/argos-${{ steps.version.outputs.tag }}-x86_64-linux"
          tar -C dist -czf "dist/argos-${{ steps.version.outputs.tag }}-x86_64-linux.tar.gz" "argos-${{ steps.version.outputs.tag }}-x86_64-linux"
          sha256sum "dist/argos-${{ steps.version.outputs.tag }}-x86_64-linux.tar.gz" > "dist/argos-${{ steps.version.outputs.tag }}-x86_64-linux.tar.gz.sha256"

      - name: Write release notes
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          previous_tag="$(git tag --sort=-v:refname | grep '^v[0-9]' | grep -v "^${tag}$" | head -n 1 || true)"
          {
            echo "## Argos ${tag}"
            echo
            if [ -n "$previous_tag" ]; then
              echo "Changes since ${previous_tag}:"
              git log --pretty='- %s (%h)' "${previous_tag}..HEAD"
            else
              echo "Changes:"
              git log --pretty='- %s (%h)' HEAD
            fi
            echo
            echo "Artifact: \`argos-${tag}-x86_64-linux.tar.gz\`"
          } > release-notes.md

      - name: Tag release
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Argos $tag"
          git push origin "$tag"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" \
            "dist/argos-${tag}-x86_64-linux.tar.gz" \
            "dist/argos-${tag}-x86_64-linux.tar.gz.sha256" \
            --title "Argos ${tag}" \
            --notes-file release-notes.md
